apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-bootstrap-qa
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: 'https://github.com/pankajrai-devops/apps-of-apps-argo'
    targetRevision: HEAD
    path: argocd-apps/qa/apps
  destination: { name: qa-cluster, namespace: argocd }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
